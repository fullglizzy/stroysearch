# Nginx-конфиг для stroysearch (шаблон: %DOMAIN% и %PORT% подставляет deploy.sh)
server {
    listen 80;
    server_name %DOMAIN% www.%DOMAIN%;

    # лимит загрузок в приложении 10 МБ — с запасом на multipart-оверхед
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:%PORT%;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Время жизни кэша для статики next/image — уменьшает нагрузку на sharp
    location /_next/image {
        proxy_pass http://127.0.0.1:%PORT%;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

services:
  postgres:
    image: postgres:16-alpine
    container_name: stroysearch-db
    environment:
      POSTGRES_USER: kokorev
      POSTGRES_PASSWORD: kokorev
      POSTGRES_DB: kokorev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: >
      postgres
      -c shared_preload_libraries=ltree
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kokorev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
